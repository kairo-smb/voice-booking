app = 'kairo-booking-engine'
primary_region = 'fra'

[build]
  dockerfile = 'booking_engine/Dockerfile.fly'

[env]
  SENTRY_ENVIRONMENT = 'production' # GlitchTip; SENTRY_DSN is a fly secret
  # In-process scheduler (services/scheduler.py), fleet-wide cadences.
  WHATSAPP_SEND_LOOP_SECONDS = '0' # off: the hourly tick drains; a per-minute drain kept Neon from ever scaling to zero
  MESSAGING_TICK_SECONDS = '3600'
  FORWARDING_HEARTBEAT_SECONDS = '86400'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
