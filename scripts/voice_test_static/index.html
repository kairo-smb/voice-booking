<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kairo Voice Test Harness</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: 600; }
  input { width: 100%; padding: 8px; font-size: 14px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 20px; font-size: 15px; cursor: pointer; }
  #status { font-weight: 600; }

  #mcpIndicator { margin-top: 12px; padding: 8px 12px; border-radius: 6px; font-weight: 600;
                  font-size: 13px; background: #eee; color: #555; transition: background 0.2s, color 0.2s; }
  #mcpIndicator.in-progress { background: #fff3cd; color: #7a5c00; }
  #mcpIndicator.success { background: #d4edda; color: #155724; }
  #mcpIndicator.failed { background: #f8d7da; color: #721c24; }

  #log { margin-top: 16px; padding: 12px; background: #f5f5f5; border-radius: 6px;
         min-height: 240px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 13px; }
  #log .line { margin-bottom: 6px; white-space: pre-wrap; }
  #log .agent { color: #0b5ed7; }
  #log .mcp { color: #7a5c00; }
  #log .mcp-ok { color: #155724; }
  #log .mcp-fail { color: #721c24; font-weight: 600; }
  #log .system { color: #888; font-style: italic; }
  #log .error { color: #721c24; font-weight: 600; }
</style>
</head>
<body>
  <h1>Kairo Voice Test Harness</h1>
  <p>Speaks to the real voice agent (same prompt/tools/DB as a real call) via OpenAI Realtime WebRTC. Tool calls hit the QA Fly app's MCP server — writes land on the QA Neon branch, not production.</p>

  <label for="shopId">Shop ID</label>
  <input id="shopId" value="">

  <label for="callerPhone">Caller phone (simulated)</label>
  <input id="callerPhone" value="+390000000000">

  <button id="startBtn">Start Call</button>
  <button id="hangupBtn" disabled>Hang Up</button>

  <p id="status">Idle</p>
  <div id="mcpIndicator">MCP: idle</div>
  <div id="log"></div>

<script>
let pc = null;
let agentLineEl = null;  // the <div> currently accumulating the agent's in-progress transcript

function logLine(cls, text) {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'line ' + cls;
  line.textContent = text;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
  return line;
}

function appendAgentDelta(delta) {
  const el = document.getElementById('log');
  if (!agentLineEl) {
    agentLineEl = logLine('agent', 'Agent: ');
  }
  agentLineEl.textContent += delta;
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function setMcpIndicator(state, text) {
  const el = document.getElementById('mcpIndicator');
  el.className = state;
  el.textContent = 'MCP: ' + text;
}

document.getElementById('startBtn').onclick = async () => {
  setStatus('Requesting session...');
  const shopId = document.getElementById('shopId').value.trim();
  const callerPhone = document.getElementById('callerPhone').value.trim();

  const sessionResp = await fetch('/session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(shopId ? { shop_id: shopId, caller_phone: callerPhone }
                                 : { caller_phone: callerPhone }),
  });
  if (!sessionResp.ok) {
    const err = await sessionResp.json();
    setStatus('Failed to create session');
    logLine('error', 'ERROR: ' + JSON.stringify(err));
    return;
  }
  const { client_secret, call_id } = await sessionResp.json();
  logLine('system', 'Session created, call_id=' + call_id);
  setStatus('Connecting...');

  pc = new RTCPeerConnection();
  const audioEl = document.createElement('audio');
  audioEl.autoplay = true;
  pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };
  document.body.appendChild(audioEl);

  const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
  pc.addTrack(mic.getTracks()[0]);

  const dc = pc.createDataChannel('oai-events');
  dc.onmessage = (e) => {
    let ev;
    try {
      ev = JSON.parse(e.data);
    } catch (err) {
      return;  // non-JSON, ignore
    }

    if (ev.type === 'response.audio_transcript.delta' && ev.delta) {
      appendAgentDelta(ev.delta);
    } else if (ev.type === 'response.audio_transcript.done') {
      agentLineEl = null;  // next delta starts a fresh line
    } else if (ev.type === 'response.mcp_call_arguments.done') {
      // Model has decided to call an MCP tool and finished streaming arguments —
      // the call itself is now in flight on OpenAI's side.
      setMcpIndicator('in-progress', 'calling ' + (ev.name || 'tool') + '...');
      logLine('mcp', '[MCP call starting: ' + (ev.name || '?') + '(' + (ev.arguments || '') + ')]');
    } else if (ev.type === 'response.output_item.done' && ev.item && ev.item.type === 'mcp_call') {
      const item = ev.item;
      setMcpIndicator('success', item.name + ' completed');
      logLine('mcp-ok', '[MCP call done: ' + item.server_label + '/' + item.name +
              ' -> ' + JSON.stringify(item.output).slice(0, 200) + ']');
    } else if (ev.type === 'response.mcp_call.failed') {
      setMcpIndicator('failed', (ev.name || 'tool') + ' failed');
      logLine('mcp-fail', '[MCP call FAILED: ' + JSON.stringify(ev).slice(0, 300) + ']');
    } else if (ev.type === 'error') {
      logLine('error', 'ERROR: ' + JSON.stringify(ev.error || ev));
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const sdpResp = await fetch('https://api.openai.com/v1/realtime/calls', {
    method: 'POST',
    body: offer.sdp,
    headers: {
      'Authorization': 'Bearer ' + client_secret,
      'Content-Type': 'application/sdp',
    },
  });
  const answerSdp = await sdpResp.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });

  setStatus('Connected — talk into your mic');
  document.getElementById('startBtn').disabled = true;
  document.getElementById('hangupBtn').disabled = false;
};

document.getElementById('hangupBtn').onclick = () => {
  if (pc) { pc.close(); pc = null; }
  agentLineEl = null;
  setStatus('Idle');
  setMcpIndicator('', 'idle');
  document.getElementById('startBtn').disabled = false;
  document.getElementById('hangupBtn').disabled = true;
};
</script>
</body>
</html>
