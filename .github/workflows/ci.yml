name: CI

# On PR into main/QA (and direct pushes to QA): fast unit tests gate every change,
# and a DB job runs the live_db suite against a local Postgres 17 whose schema is
# cloned from Neon (so business_app_core + voice_agent match production exactly).
# This is the compliance check: voice-booking's queries run against the real schema.
# Production is never touched (tests hit localhost; QA is read schema-only).

on:
  pull_request:
    branches: [main, QA]
  push:
    branches: [QA]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (no DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r booking_engine/requirements.txt pytest pytest-asyncio httpx anyio
      - name: Run unit tests
        run: pytest tests/voice_gateway/ tests/booking_engine/ -q

  db-tests:
    name: live_db against Neon-cloned schema
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17          # matches Neon (17.x)
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kairo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Local container — no SSL, not production. The conftest guard accepts it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairo_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kairo_test
      LOCAL_DB: postgresql://postgres:postgres@localhost:5432/kairo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install PostgreSQL 17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Clone Neon schema into local Postgres
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --schema-only --no-owner --no-privileges \
            "${{ secrets.CI_SCHEMA_SOURCE_URL }}" > /tmp/schema.sql
          psql -v ON_ERROR_STOP=1 "$LOCAL_DB" -f /tmp/schema.sql

      - name: Load seed data into business_app_core
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          PGOPTIONS="-c search_path=business_app_core,public" \
            psql -v ON_ERROR_STOP=1 "$LOCAL_DB" -f booking_engine/db/sql/02_seed_data.sql

      - run: pip install -r booking_engine/requirements.txt pytest pytest-asyncio httpx anyio

      - name: Run live_db tests
        run: pytest tests/live_db/ -q
