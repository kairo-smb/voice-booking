name: Deploy Booking Engine

on:
  push:
    branches: [main]
    paths:
      - 'booking_engine/**'
      - 'lambda_handler.py'
      - 'tests/**'
      - 'scripts/deploy-booking.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  LAMBDA_FUNCTION: booking-engine-api
  API_GATEWAY_NAME: booking-engine-api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r booking_engine/requirements.txt pytest pytest-asyncio httpx anyio

      - name: Run unit tests
        run: pytest tests/voice_gateway/ tests/booking_engine/ -v --ignore=tests/live_db --ignore=tests/integration -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve API Gateway URL
        id: apiurl
        run: |
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${{ env.API_GATEWAY_NAME }}'].ApiId" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          if [[ -n "$API_ID" ]]; then
            echo "url=https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com" >> "$GITHUB_OUTPUT"
          else
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        env:
          AWS_PROFILE: default
          AWS_REGION: ${{ env.AWS_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CONTROL_PLANE_SECRET: ${{ secrets.CONTROL_PLANE_SECRET }}
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          TELNYX_PUBLIC_KEY: ${{ secrets.TELNYX_PUBLIC_KEY }}
          OPENAI_SIP_PROJECT_ID: ${{ secrets.OPENAI_SIP_PROJECT_ID }}
          PUBLIC_BASE_URL: ${{ steps.apiurl.outputs.url }}
        run: |
          chmod +x scripts/deploy-booking.sh
          ./scripts/deploy-booking.sh

      - name: Update PUBLIC_BASE_URL if API Gateway was just created
        if: steps.apiurl.outputs.url == ''
        run: |
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${{ env.API_GATEWAY_NAME }}'].ApiId" \
            --output text \
            --region ${{ env.AWS_REGION }})
          NEW_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com"

          CURRENT_ENV=$(aws lambda get-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --query 'Environment.Variables' \
            --output json \
            --region ${{ env.AWS_REGION }})

          MERGED=$(echo "$CURRENT_ENV" | jq --arg url "$NEW_URL" '. + {PUBLIC_BASE_URL: $url}')

          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION }} \
            --region ${{ env.AWS_REGION }} \
            --environment "Variables=$(echo "$MERGED" | jq -c .)" >/dev/null

          echo "PUBLIC_BASE_URL set to: ${NEW_URL}"

      - name: Smoke test
        run: |
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='${{ env.API_GATEWAY_NAME }}'].ApiId" \
            --output text \
            --region ${{ env.AWS_REGION }})
          URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com"
          SECRET="${{ secrets.CONTROL_PLANE_SECRET }}"
          SHOP_ID="${{ secrets.DEMO_SHOP_ID }}"

          echo "Testing health endpoint..."
          curl -sf "$URL/health" | jq .

          echo "Testing auth gate (expect 401)..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/v1/voice/config/$SHOP_ID")
          echo "Status: $STATUS (expected 401)"

          echo "Testing voice config..."
          curl -sf -H "Authorization: Bearer $SECRET" "$URL/api/v1/voice/config/$SHOP_ID" | jq .

          echo "Testing voice balance..."
          curl -sf -H "Authorization: Bearer $SECRET" "$URL/api/v1/voice/balance/$SHOP_ID" | jq .

          echo "All smoke tests passed."
